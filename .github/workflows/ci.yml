name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # The unit tests only need Pillow (rendering), pytest and ruff.
        # faster-whisper (transcription) is intentionally NOT installed
        # here: no test imports it, and the CLI imports it lazily.
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy pytest ruff

      - name: Lint
        run: ruff check persian_clip_subtitler tests

      - name: Unit tests
        run: pytest tests/ -v

      - name: CLI smoke test
        run: python -m persian_clip_subtitler --help
